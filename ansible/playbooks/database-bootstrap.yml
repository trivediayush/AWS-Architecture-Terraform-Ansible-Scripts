---
# Run from an approved host that can reach the private RDS endpoint.
# Export secrets from the approved secret store into the process environment first.
# Do not put passwords in inventory, vars files, command-line arguments, or source control.
- name: Create the two logical databases and their separate login users
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pg_host: "{{ lookup('env', 'RDS_ENDPOINT') }}"
    pg_port: "{{ lookup('env', 'RDS_PORT') | default('5432', true) }}"
    pg_admin_user: "{{ lookup('env', 'RDS_MASTER_USERNAME') }}"
    pg_admin_password: "{{ lookup('env', 'RDS_MASTER_PASSWORD') }}"
    staging_user: "{{ lookup('env', 'STAGING_DB_USERNAME') }}"
    staging_password: "{{ lookup('env', 'STAGING_DB_PASSWORD') }}"
    production_user: "{{ lookup('env', 'PRODUCTION_DB_USERNAME') }}"
    production_password: "{{ lookup('env', 'PRODUCTION_DB_PASSWORD') }}"
    pg_ca_bundle: "{{ lookup('env', 'RDS_CA_BUNDLE') }}"
  tasks:
    - name: Validate required connection inputs without printing secret values
      ansible.builtin.assert:
        that:
          - pg_host | length > 0
          - pg_admin_user | length > 0
          - pg_admin_password | length > 0
          - staging_user | length > 0
          - staging_password | length > 0
          - production_user | length > 0
          - production_password | length > 0
          - pg_ca_bundle | length > 0
        fail_msg: "Required DB environment variables are missing. Secret values are not printed."
      no_log: true

    - name: Create staging database
      community.postgresql.postgresql_db:
        name: staging_app
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_admin_user }}"
        login_password: "{{ pg_admin_password }}"
        ssl_mode: verify-full
        ssl_rootcert: "{{ pg_ca_bundle }}"
        state: present
      no_log: true

    - name: Create production database
      community.postgresql.postgresql_db:
        name: production_app
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_admin_user }}"
        login_password: "{{ pg_admin_password }}"
        ssl_mode: verify-full
        ssl_rootcert: "{{ pg_ca_bundle }}"
        state: present
      no_log: true

    - name: Create staging database login
      community.postgresql.postgresql_user:
        name: "{{ staging_user }}"
        password: "{{ staging_password }}"
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_admin_user }}"
        login_password: "{{ pg_admin_password }}"
        ssl_mode: verify-full
        ssl_rootcert: "{{ pg_ca_bundle }}"
        db: staging_app
        priv: "CONNECT"
        state: present
      no_log: true

    - name: Create production database login
      community.postgresql.postgresql_user:
        name: "{{ production_user }}"
        password: "{{ production_password }}"
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: "{{ pg_admin_user }}"
        login_password: "{{ pg_admin_password }}"
        ssl_mode: verify-full
        ssl_rootcert: "{{ pg_ca_bundle }}"
        db: production_app
        priv: "CONNECT"
        state: present
      no_log: true
